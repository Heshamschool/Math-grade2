<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مسابقة أكمل النمط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#3BB4E5; --sky-dark:#1C93C7;
    --sun:#FFC93C; --coral:#FF6F5E; --mint:#2FD4B2;
    --teamA:#3BB4E5; --teamA-dark:#1C93C7;
    --teamB:#FF6F5E; --teamB-dark:#d8443a;
    --paper:#FFFBF2; --ink:#233752; --ink-soft:#5C7089; --line:#E4E9F0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #FFF4D6 0%, transparent 40%),
      radial-gradient(circle at 90% 12%, #E4F7FF 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:18px 12px 40px;
  }
  .app{width:100%;max-width:680px;}

  .topbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;position:relative;}
  .back-link{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;gap:5px;
    height:32px;padding:0 12px;border-radius:10px;background:var(--sky-dark);
    color:#fff;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap;
  }
  .brand-badge{width:40px;height:40px;border-radius:12px;background:linear-gradient(155deg,var(--sky),var(--sky-dark));display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;box-shadow:0 4px 0 #1477a0;}
  .brand-title{font-weight:800;font-size:18px;}

  .card{background:#fff;border:3px solid var(--line);border-radius:26px;padding:22px 18px 26px;box-shadow:0 8px 0 var(--line);position:relative;overflow:hidden;}

  /* ---------- setup ---------- */
  .field-label{font-weight:800;font-size:14px;margin-bottom:6px;display:block;}
  .team-row{display:flex;gap:10px;margin-top:6px;}
  .team-input-wrap{flex:1;}
  input.team-input{
    width:100%;border:2.5px solid var(--line);border-radius:14px;padding:11px;
    font-family:inherit;font-size:14.5px;font-weight:800;color:var(--ink);text-align:center;background:#F8FAFD;
  }
  input.team-input:focus{outline:none;}
  #teamAInput{border-color:#bfe6f6;}
  #teamBInput{border-color:#ffd4cd;}

  .opt-row{display:flex;gap:10px;margin-top:8px;}
  .opt{flex:1;background:#F8FAFD;border:2.5px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;font-weight:800;font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .opt.active{border-color:var(--sky-dark);background:#E9F6FC;color:var(--sky-dark);}
  .section-gap{margin-top:18px;}

  .start-btn{
    display:block;width:100%;margin-top:22px;background:linear-gradient(155deg,var(--mint),#1fc19d);
    border:none;color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:15px;
    border-radius:16px;box-shadow:0 5px 0 #17a583;cursor:pointer;
  }
  .start-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #17a583;}

  /* ---------- scoreboard ---------- */
  .scoreboard{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .team-card{flex:1;border-radius:18px;padding:12px 8px;text-align:center;border:3px solid transparent;transition:transform .2s, box-shadow .2s;}
  .team-card.a{background:#E9F6FC;color:var(--teamA-dark);}
  .team-card.b{background:#FFEFEC;color:var(--teamB-dark);}
  .team-card.turn{transform:scale(1.06);box-shadow:0 6px 0 rgba(0,0,0,.08);}
  .team-card.a.turn{border-color:var(--teamA-dark);}
  .team-card.b.turn{border-color:var(--teamB-dark);}
  .team-card .tname{font-weight:800;font-size:13.5px;}
  .team-card .tscore{font-weight:900;font-size:30px;line-height:1.1;}
  .vs{font-weight:900;font-size:14px;color:var(--ink-soft);}

  .turn-banner{text-align:center;font-weight:800;font-size:14.5px;color:var(--ink-soft);margin-bottom:6px;}
  .turn-banner b{color:var(--ink);}
  .q-progress{text-align:center;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:14px;}

  .timer-wrap{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:18px;border:1px solid #d9e0ea;}
  .timer-bar{height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),#4FE3C1);transition:width 1s linear,background .3s;}
  .timer-bar.warn{background:linear-gradient(90deg,var(--sun),#ffdb7a);}
  .timer-bar.danger{background:linear-gradient(90deg,var(--coral),#ff9088);}

  .prompt{text-align:center;font-weight:800;font-size:15.5px;margin:2px 0 14px;color:var(--ink-soft);}

  .pattern-row{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    background:#F8FAFD;border:2.5px dashed #D6E0EC;border-radius:20px;padding:22px 10px;margin-bottom:20px;
  }
  .disp-num{font-family:'Baloo 2','Cairo',sans-serif;font-weight:700;font-size:44px;color:var(--sky-dark);}
  .disp-sym{font-weight:900;font-size:32px;color:#9db3c4;}
  .disp-blank{font-family:'Baloo 2','Cairo',sans-serif;font-weight:900;font-size:48px;color:var(--coral);}

  .answers{display:flex;gap:10px;}
  .ans-btn{flex:1;background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 6px;font-family:inherit;font-weight:900;font-size:28px;color:var(--sky-dark);cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .08s ease,box-shadow .08s ease;}
  .ans-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .ans-btn.correct{background:#EAFBF5;border-color:var(--mint);color:#159c7b;box-shadow:0 5px 0 #24b493;}
  .ans-btn.wrong{background:#FFEEEC;border-color:var(--coral);color:#d8443a;box-shadow:0 5px 0 #e2564a;}
  .ans-btn[disabled]{cursor:default;}
  .ans-btn.dim{opacity:.5;}

  .feedback{text-align:center;font-weight:800;font-size:15px;margin-top:14px;min-height:22px;color:var(--ink-soft);}
  .feedback.good{color:#159c7b;}
  .feedback.bad{color:#d8443a;}

  /* ---------- end screen ---------- */
  .end-emoji{font-size:54px;text-align:center;}
  .end-title{font-weight:900;font-size:22px;margin:8px 0 2px;text-align:center;}
  .end-sub{color:var(--ink-soft);font-weight:600;font-size:13.5px;margin-bottom:18px;text-align:center;}
  .final-row{display:flex;gap:10px;margin-bottom:8px;}
  .final-team{flex:1;border-radius:18px;padding:16px 8px;text-align:center;}
  .final-team.a{background:#E9F6FC;color:var(--teamA-dark);}
  .final-team.b{background:#FFEFEC;color:var(--teamB-dark);}
  .final-team .fn{font-weight:800;font-size:14px;}
  .final-team .fs{font-weight:900;font-size:36px;}
  .final-team.winner{box-shadow:0 0 0 3px currentColor inset;}

  .restart-btn{
    display:block;width:100%;margin-top:16px;background:linear-gradient(155deg,var(--sky),var(--sky-dark));
    border:none;color:#fff;font-family:inherit;font-weight:800;font-size:15px;padding:13px;
    border-radius:16px;box-shadow:0 5px 0 #146f95;cursor:pointer;
  }
  .restart-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #146f95;}

  .hidden{display:none !important;}

  @media (max-width:380px){
    .disp-num{font-size:32px;}
    .disp-blank{font-size:36px;}
    .ans-btn{font-size:22px;}
    .team-card .tscore{font-size:24px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <a class="back-link" href="index.html">🏠 الرئيسية</a>
    <div class="brand-badge" id="brandBadge">🧩</div>
    <div class="brand-title" id="brandTitle">مسابقة أكمل النمط</div>
  </div>

  <!-- ===================== SETUP ===================== -->
  <div id="setupScreen" class="card">
    <span class="field-label">أسماء الفرق</span>
    <div class="team-row">
      <div class="team-input-wrap">
        <input id="teamAInput" class="team-input" type="text" value="🔵 الفريق الأزرق">
      </div>
      <div class="team-input-wrap">
        <input id="teamBInput" class="team-input" type="text" value="🔴 الفريق الأحمر">
      </div>
    </div>

    <div class="section-gap">
      <span class="field-label">عدد الأسئلة</span>
      <div class="opt-row">
        <div class="opt active" id="q6" data-n="6">٦ أسئلة</div>
        <div class="opt" id="q10" data-n="10">١٠ أسئلة</div>
      </div>
    </div>

    <div class="section-gap">
      <span class="field-label">مدة كل سؤال</span>
      <div class="opt-row">
        <div class="opt active" id="t10" data-t="10">١٠ ثوانٍ</div>
        <div class="opt" id="t20" data-t="20">٢٠ ثانية</div>
      </div>
    </div>

    <button class="start-btn" id="startBtn">ابدأ المسابقة</button>
  </div>

  <!-- ===================== GAME ===================== -->
  <div id="gameScreen" class="hidden">
    <div class="scoreboard">
      <div class="team-card a" id="teamACard">
        <div class="tname" id="teamANameEl"></div>
        <div class="tscore" id="teamAScoreEl">٠</div>
      </div>
      <div class="vs">VS</div>
      <div class="team-card b" id="teamBCard">
        <div class="tname" id="teamBNameEl"></div>
        <div class="tscore" id="teamBScoreEl">٠</div>
      </div>
    </div>

    <div class="turn-banner">دور: <b id="turnName"></b></div>
    <div class="q-progress" id="qProgress"></div>

    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>

    <div class="card">
      <div class="prompt" id="promptText">أكمل النمط — ما العدد التالي؟</div>
      <div class="pattern-row" id="patternRow"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- ===================== END ===================== -->
  <div id="endScreen" class="card hidden">
    <div class="end-emoji" id="endEmoji">🏆</div>
    <div class="end-title" id="endTitle"></div>
    <div class="end-sub" id="endSub">نتيجة المسابقة</div>
    <div class="final-row">
      <div class="final-team a" id="finalA">
        <div class="fn" id="finalANameEl"></div>
        <div class="fs" id="finalAScoreEl"></div>
      </div>
      <div class="final-team b" id="finalB">
        <div class="fn" id="finalBNameEl"></div>
        <div class="fs" id="finalBScoreEl"></div>
      </div>
    </div>
    <button class="restart-btn" id="restartBtn">مسابقة جديدة</button>
  </div>

</div>

<script src="engine.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const topic = params.get('topic') || 'pattern';
  const lessonTitle = params.get('title') || '';
  const range = params.get('range') || (/رقمين/.test(lessonTitle) ? 'twoDigit' : 'basic');
  const meta = MathEngine.TOPIC_META[topic] || MathEngine.TOPIC_META.pattern;

  document.getElementById('brandBadge').textContent = meta.icon;
  document.getElementById('brandTitle').textContent = 'مسابقة ' + meta.label;
  document.getElementById('endSub').textContent = 'نتيجة مسابقة ' + meta.label;

  let TOTAL_ROUNDS = 6;
  let TIME_LIMIT = 10;
  let teamA = { name:'', score:0 };
  let teamB = { name:'', score:0 };
  let currentTeam = 'A';
  let round = 0;
  let current = null;
  let timeLeft = TIME_LIMIT;
  let timerId = null;
  let answered = false;

  const teamAInput = document.getElementById('teamAInput');
  const teamBInput = document.getElementById('teamBInput');
  const q6 = document.getElementById('q6'), q10 = document.getElementById('q10');
  const t10 = document.getElementById('t10'), t20 = document.getElementById('t20');
  const startBtn = document.getElementById('startBtn');

  const setupScreen = document.getElementById('setupScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');

  const teamACard = document.getElementById('teamACard');
  const teamBCard = document.getElementById('teamBCard');
  const teamANameEl = document.getElementById('teamANameEl');
  const teamBNameEl = document.getElementById('teamBNameEl');
  const teamAScoreEl = document.getElementById('teamAScoreEl');
  const teamBScoreEl = document.getElementById('teamBScoreEl');
  const turnName = document.getElementById('turnName');
  const qProgress = document.getElementById('qProgress');
  const timerBar = document.getElementById('timerBar');
  const patternRow = document.getElementById('patternRow');
  const promptText = document.getElementById('promptText');
  const answersWrap = document.getElementById('answers');
  const feedback = document.getElementById('feedback');

  const endEmoji = document.getElementById('endEmoji');
  const endTitle = document.getElementById('endTitle');
  const finalA = document.getElementById('finalA');
  const finalB = document.getElementById('finalB');
  const finalANameEl = document.getElementById('finalANameEl');
  const finalBNameEl = document.getElementById('finalBNameEl');
  const finalAScoreEl = document.getElementById('finalAScoreEl');
  const finalBScoreEl = document.getElementById('finalBScoreEl');
  const restartBtn = document.getElementById('restartBtn');

  const toArabicDigits = MathEngine.toArabicDigits;

  q6.addEventListener('click', ()=>{ TOTAL_ROUNDS=6; q6.classList.add('active'); q10.classList.remove('active'); });
  q10.addEventListener('click', ()=>{ TOTAL_ROUNDS=10; q10.classList.add('active'); q6.classList.remove('active'); });
  t10.addEventListener('click', ()=>{ TIME_LIMIT=10; t10.classList.add('active'); t20.classList.remove('active'); });
  t20.addEventListener('click', ()=>{ TIME_LIMIT=20; t20.classList.add('active'); t10.classList.remove('active'); });

  function startGame(){
    teamA.name = teamAInput.value.trim() || '🔵 الفريق الأزرق';
    teamB.name = teamBInput.value.trim() || '🔴 الفريق الأحمر';
    teamA.score = 0; teamB.score = 0;
    currentTeam = 'A';
    round = 0;
    teamANameEl.textContent = teamA.name;
    teamBNameEl.textContent = teamB.name;
    setupScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    loadRound();
  }
  startBtn.addEventListener('click', startGame);

  // ---------- question generator (shared engine) ----------
  function loadRound(){
    answered = false;
    feedback.textContent = '';
    feedback.className = 'feedback';

    currentTeam = (round % 2 === 0) ? 'A' : 'B';
    const activeName = currentTeam === 'A' ? teamA.name : teamB.name;
    turnName.textContent = activeName;
    teamACard.classList.toggle('turn', currentTeam === 'A');
    teamBCard.classList.toggle('turn', currentTeam === 'B');

    qProgress.textContent = 'السؤال ' + toArabicDigits(round+1) + ' من ' + toArabicDigits(TOTAL_ROUNDS);

    current = MathEngine.generate(topic, {range});
    promptText.textContent = current.prompt;

    patternRow.innerHTML = '';
    current.parts.forEach(p=>{
      const el = document.createElement('span');
      if(p.t==='n'){ el.className='disp-num'; el.textContent = toArabicDigits(p.v); }
      else if(p.t==='s'){ el.className='disp-sym'; el.textContent = p.v; }
      else { el.className='disp-blank'; el.textContent = '؟'; }
      patternRow.appendChild(el);
    });

    answersWrap.innerHTML = '';
    current.options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = current.optionType==='symbol' ? MathEngine.symbolFor(opt) : toArabicDigits(opt);
      btn.dataset.val = opt;
      answersWrap.appendChild(btn);
    });

    startTimer();
  }

  function startTimer(){
    clearInterval(timerId);
    timeLeft = TIME_LIMIT;
    timerBar.style.width = '100%';
    timerBar.classList.remove('warn','danger');
    timerId = setInterval(()=>{
      timeLeft -= 1;
      const pct = Math.max(0, (timeLeft/TIME_LIMIT)*100);
      timerBar.style.width = pct + '%';
      if(timeLeft <= Math.ceil(TIME_LIMIT*0.3)) timerBar.classList.add('danger');
      else if(timeLeft <= Math.ceil(TIME_LIMIT*0.6)) timerBar.classList.add('warn');
      if(timeLeft <= 0){
        clearInterval(timerId);
        if(!answered) handleAnswer(null);
      }
    },1000);
  }

  function handleAnswer(val){
    if(answered) return;
    answered = true;
    clearInterval(timerId);

    const isRight = val === current.answer;

    Array.from(answersWrap.children).forEach(btn=>{
      btn.disabled = true;
      const bv = current.optionType==='symbol' ? btn.dataset.val : Number(btn.dataset.val);
      if(bv === current.answer) btn.classList.add('correct');
      else if(bv === val && !isRight) btn.classList.add('wrong');
      else btn.classList.add('dim');
    });

    const activeName = currentTeam === 'A' ? teamA.name : teamB.name;
    const shownAnswer = current.optionType==='symbol' ? MathEngine.symbolFor(current.answer) : toArabicDigits(current.answer);
    if(isRight){
      if(currentTeam === 'A') teamA.score += 1; else teamB.score += 1;
      feedback.textContent = 'إجابة صحيحة! نقطة لـ ' + activeName + ' 🎉';
      feedback.classList.add('good');
    } else {
      feedback.textContent = (val===null ? 'انتهى الوقت! ' : 'إجابة خاطئة. ') + 'الإجابة الصحيحة هي ' + shownAnswer;
      feedback.classList.add('bad');
    }

    teamAScoreEl.textContent = toArabicDigits(teamA.score);
    teamBScoreEl.textContent = toArabicDigits(teamB.score);

    setTimeout(advance, 1600);
  }

  function advance(){
    round += 1;
    if(round >= TOTAL_ROUNDS){
      showEnd();
      return;
    }
    loadRound();
  }

  answersWrap.addEventListener('click', (e)=>{
    const btn = e.target.closest('.ans-btn');
    if(!btn || answered) return;
    const val = current.optionType==='symbol' ? btn.dataset.val : Number(btn.dataset.val);
    handleAnswer(val);
  });

  function showEnd(){
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');

    finalANameEl.textContent = teamA.name;
    finalBNameEl.textContent = teamB.name;
    finalAScoreEl.textContent = toArabicDigits(teamA.score);
    finalBScoreEl.textContent = toArabicDigits(teamB.score);
    finalA.classList.remove('winner');
    finalB.classList.remove('winner');

    if(teamA.score === teamB.score){
      endEmoji.textContent = '🤝';
      endTitle.textContent = 'تعادل رائع!';
    } else if(teamA.score > teamB.score){
      endEmoji.textContent = '🏆';
      endTitle.textContent = teamA.name + ' يفوز!';
      finalA.classList.add('winner');
    } else {
      endEmoji.textContent = '🏆';
      endTitle.textContent = teamB.name + ' يفوز!';
      finalB.classList.add('winner');
    }
  }

  restartBtn.addEventListener('click', ()=>{
    endScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  });

})();
</script>
</body>
</html>
