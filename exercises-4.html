<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تمارين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#2E8B7D; --teal-dark:#1F6357; --teal-light:#E8F5F2; --teal-mid:#CDE9E3;
    --red:#C0392B; --red-dark:#96271C;
    --gold:#F2C230; --gold-dark:#B98B0E;
    --ink:#22303F; --ink-soft:#5C6B7A; --line:#E3E8EE; --paper:#F7F8FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #EAF7F3 0%, transparent 45%),
      radial-gradient(circle at 95% 10%, #FFF7E0 0%, transparent 40%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:0 0 40px;
  }
  .app{width:100%;max-width:680px;margin:0 auto;}

  .topbar{
    background:linear-gradient(135deg, var(--teal), var(--teal-dark));
    padding:16px 16px 34px;
  }
  .topbar-inner{display:flex;align-items:center;gap:10px;}
  .back-link{
    display:flex;align-items:center;justify-content:center;gap:5px;
    height:36px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.18);
    color:#fff;text-decoration:none;font-size:12.5px;font-weight:800;flex-shrink:0;white-space:nowrap;
  }
  .topic-icon{
    width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
  }
  .topbar-title{font-weight:800;font-size:16px;color:#fff;}
  .topbar-sub{font-weight:500;font-size:11.5px;color:#d9f0ea;}

  .content-wrap{padding:0 14px;margin-top:-20px;}

  .progress-card{
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;
    box-shadow:0 6px 16px rgba(20,40,70,.08);margin-bottom:16px;
  }
  .progress-label{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:8px;text-align:center;}
  .dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .dot{width:22px;height:8px;border-radius:5px;background:var(--line);}
  .dot.done{background:var(--teal);}
  .dot.wrong{background:var(--red);}
  .dot.current{background:var(--gold);}

  .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 18px;box-shadow:0 6px 18px rgba(20,40,70,.08);}
  .q-label{text-align:center;font-weight:800;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .prompt{text-align:center;font-weight:800;font-size:16.5px;margin:2px 0 20px;color:var(--ink);}

  .display-row{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    background:var(--teal-light);border:2px dashed var(--teal-mid);border-radius:20px;padding:26px 12px;margin-bottom:22px;
  }
  .disp-num{font-family:'Baloo 2','Cairo',sans-serif;font-weight:700;font-size:44px;color:var(--teal-dark);}
  .disp-sym{font-weight:900;font-size:34px;color:#9db8b0;}
  .disp-blank{font-family:'Baloo 2','Cairo',sans-serif;font-weight:900;font-size:48px;color:var(--red);}

  .answers{display:flex;gap:10px;margin-bottom:16px;}
  .ans-btn{
    flex:1;background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:16px 6px;
    font-family:inherit;font-weight:900;font-size:26px;color:var(--teal-dark);cursor:pointer;
    transition:transform .08s ease;
  }
  .ans-btn:active{transform:translateY(2px);}
  .ans-btn.correct{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);}
  .ans-btn.wrong{background:#FBEAE8;border-color:var(--red);color:var(--red-dark);}
  .ans-btn[disabled]{cursor:default;}
  .ans-btn.dim{opacity:.5;}

  .feedback{text-align:center;font-weight:800;font-size:14.5px;min-height:20px;margin-bottom:6px;}
  .feedback.good{color:var(--teal-dark);}
  .feedback.bad{color:var(--red-dark);}

  .next-btn{
    display:block;margin:14px auto 0;background:linear-gradient(155deg,var(--gold),var(--gold-dark));
    border:none;border-radius:14px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:14px;
    color:#5c4400;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .next-btn.show{opacity:1;pointer-events:auto;}

  /* ---------- summary ---------- */
  .summary-emoji{font-size:48px;text-align:center;}
  .summary-title{font-weight:900;font-size:21px;margin:6px 0 2px;text-align:center;color:var(--teal-dark);}
  .summary-sub{color:var(--ink-soft);font-weight:600;font-size:13px;margin-bottom:18px;text-align:center;}
  .summary-score{text-align:center;font-weight:900;font-size:34px;color:var(--teal-dark);margin-bottom:18px;}
  .summary-actions{display:flex;flex-direction:column;gap:10px;}
  .retry-btn, .back-btn{
    font-family:inherit;font-weight:800;font-size:14.5px;border-radius:14px;padding:13px;
    cursor:pointer;text-align:center;text-decoration:none;
  }
  .retry-btn{background:var(--teal);color:#fff;border:none;}
  .back-btn{background:#fff;border:2px solid var(--line);color:var(--ink);}

  .hidden{display:none !important;}

  @media (max-width:380px){
    .disp-num{font-size:32px;}
    .disp-blank{font-size:34px;}
    .ans-btn{font-size:20px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="topbar-inner">
      <a class="back-link" href="index.html">🏠 الرئيسية</a>
      <div class="topic-icon" id="topicIcon">📝</div>
      <div>
        <div class="topbar-title" id="topbarTitle">تمارين</div>
        <div class="topbar-sub">تدريب ذاتي — أسئلة جديدة في كل مرة</div>
      </div>
    </div>
  </div>

  <div class="content-wrap">
    <div class="progress-card">
      <div class="progress-label" id="progressLabel">السؤال ١ من ٨</div>
      <div class="dots" id="dots"></div>
    </div>

    <div id="quizScreen" class="card">
      <div class="q-label" id="qLabel"></div>
      <div class="prompt" id="promptText"></div>
      <div class="display-row" id="displayRow"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">السؤال التالي ←</button>
    </div>

    <div id="summaryScreen" class="card hidden">
      <div class="summary-emoji" id="summaryEmoji">🌟</div>
      <div class="summary-title" id="summaryTitle">أحسنت!</div>
      <div class="summary-sub">نتيجتك في هذه الجلسة</div>
      <div class="summary-score" id="summaryScore">٨ / ٨</div>
      <div class="summary-actions">
        <button class="retry-btn" id="retryBtn">أسئلة جديدة</button>
        <a class="back-btn" href="index.html">العودة إلى الدرس</a>
      </div>
    </div>
  </div>

</div>

<script src="engine.js"></script>
<script>
(function(){
  const TOTAL = 8;

  const params = new URLSearchParams(location.search);
  const topic = params.get('topic') || 'pattern';
  const title = params.get('title') || '';
  const chapterParam = params.get('chapter') || '';
  const range = params.get('range') || (/رقمين/.test(title) ? 'twoDigit' : 'basic');
  const meta = MathEngine.TOPIC_META[topic] || MathEngine.TOPIC_META.pattern;

  document.getElementById('topicIcon').textContent = meta.icon;
  document.getElementById('topbarTitle').textContent = 'تمارين — ' + (title || meta.label);

  let index = 0;
  let answered = false;
  let correctCount = 0;
  let qResults = new Array(TOTAL).fill('pending');
  let current = null;

  const dots = document.getElementById('dots');
  const progressLabel = document.getElementById('progressLabel');
  const qLabel = document.getElementById('qLabel');
  const promptText = document.getElementById('promptText');
  const displayRow = document.getElementById('displayRow');
  const answersWrap = document.getElementById('answers');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const quizScreen = document.getElementById('quizScreen');
  const summaryScreen = document.getElementById('summaryScreen');
  const summaryEmoji = document.getElementById('summaryEmoji');
  const summaryTitle = document.getElementById('summaryTitle');
  const summaryScore = document.getElementById('summaryScore');
  const retryBtn = document.getElementById('retryBtn');

  function buildDots(){
    dots.innerHTML = '';
    for(let i=0;i<TOTAL;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.id = 'dot'+i;
      dots.appendChild(d);
    }
  }
  function updateDots(){
    for(let i=0;i<TOTAL;i++){
      const d = document.getElementById('dot'+i);
      d.className = 'dot';
      if(qResults[i]==='right') d.classList.add('done');
      else if(qResults[i]==='wrong') d.classList.add('wrong');
      else if(i===index) d.classList.add('current');
    }
  }

  function renderDisplay(parts){
    displayRow.innerHTML = '';
    parts.forEach(p=>{
      const el = document.createElement('span');
      if(p.t==='n'){ el.className='disp-num'; el.textContent = MathEngine.toArabicDigits(p.v); }
      else if(p.t==='s'){ el.className='disp-sym'; el.textContent = p.v; }
      else { el.className='disp-blank'; el.textContent = '؟'; }
      displayRow.appendChild(el);
    });
  }

  function loadQuestion(){
    answered = false;
    feedback.textContent = '';
    feedback.className = 'feedback';
    nextBtn.classList.remove('show');

    current = MathEngine.generate(topic, {range});
    qLabel.textContent = 'تمرين ' + MathEngine.toArabicDigits(index+1);
    progressLabel.textContent = 'السؤال ' + MathEngine.toArabicDigits(index+1) + ' من ' + MathEngine.toArabicDigits(TOTAL);
    promptText.textContent = current.prompt;
    renderDisplay(current.parts);

    answersWrap.innerHTML = '';
    current.options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = current.optionType==='symbol' ? MathEngine.symbolFor(opt) : MathEngine.toArabicDigits(opt);
      btn.dataset.val = opt;
      answersWrap.appendChild(btn);
    });

    updateDots();
  }

  function handleAnswer(val){
    if(answered) return;
    answered = true;
    const isRight = val === current.answer;

    Array.from(answersWrap.children).forEach(btn=>{
      btn.disabled = true;
      const bv = current.optionType==='symbol' ? btn.dataset.val : Number(btn.dataset.val);
      if(bv === current.answer) btn.classList.add('correct');
      else if(bv === val && !isRight) btn.classList.add('wrong');
      else btn.classList.add('dim');
    });

    if(isRight){
      correctCount += 1;
      qResults[index] = 'right';
      feedback.textContent = 'صحيح! أحسنت 👏';
      feedback.classList.add('good');
    } else {
      qResults[index] = 'wrong';
      const shownAnswer = current.optionType==='symbol' ? MathEngine.symbolFor(current.answer) : MathEngine.toArabicDigits(current.answer);
      feedback.textContent = 'حاول مرة أخرى في المرة القادمة — الصحيح هو ' + shownAnswer;
      feedback.classList.add('bad');
    }
    updateDots();
    nextBtn.classList.add('show');
  }

  answersWrap.addEventListener('click', (e)=>{
    const btn = e.target.closest('.ans-btn');
    if(!btn || answered) return;
    const val = current.optionType==='symbol' ? btn.dataset.val : Number(btn.dataset.val);
    handleAnswer(val);
  });

  nextBtn.addEventListener('click', ()=>{
    index += 1;
    if(index >= TOTAL){ showSummary(); return; }
    loadQuestion();
  });

  function showSummary(){
    quizScreen.classList.add('hidden');
    summaryScreen.classList.remove('hidden');
    summaryScore.textContent = MathEngine.toArabicDigits(correctCount) + ' / ' + MathEngine.toArabicDigits(TOTAL);
    if(correctCount === TOTAL){ summaryEmoji.textContent='🌟'; summaryTitle.textContent='ممتاز! إجابات كاملة'; }
    else if(correctCount >= TOTAL*0.6){ summaryEmoji.textContent='👍'; summaryTitle.textContent='أحسنت صنعًا!'; }
    else { summaryEmoji.textContent='💪'; summaryTitle.textContent='واصل التدريب'; }
  }

  retryBtn.addEventListener('click', ()=>{
    index = 0; correctCount = 0; qResults = new Array(TOTAL).fill('pending');
    summaryScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    buildDots();
    loadQuestion();
  });

  buildDots();
  loadQuestion();
})();
</script>
</body>
</html>
