<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>أداة ضغط الصور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#2E8B7D; --teal-dark:#1F6357; --teal-light:#E8F5F2; --teal-mid:#CDE9E3;
    --red:#C0392B; --red-dark:#96271C;
    --gold:#F2C230; --gold-dark:#B98B0E;
    --ink:#22303F; --ink-soft:#5C6B7A; --line:#E3E8EE; --paper:#F7F8FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #EAF7F3 0%, transparent 45%),
      radial-gradient(circle at 95% 10%, #FFF7E0 0%, transparent 40%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:0 0 40px;
  }
  .app{width:100%;max-width:720px;margin:0 auto;}

  .topbar{
    background:linear-gradient(135deg, var(--teal), var(--teal-dark));
    padding:16px 16px 34px;
  }
  .topbar-inner{display:flex;align-items:center;gap:10px;}
  .back-link{
    display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);
    color:#fff;text-decoration:none;font-size:16px;flex-shrink:0;
  }
  .topic-icon{
    width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
  }
  .topbar-title{font-weight:800;font-size:16px;color:#fff;}
  .topbar-sub{font-weight:500;font-size:11.5px;color:#d9f0ea;}

  .content-wrap{padding:0 14px;margin-top:-20px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:0 6px 18px rgba(20,40,70,.08);margin-bottom:16px;}

  /* ---------- controls ---------- */
  .controls-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .control{flex:1;min-width:140px;}
  .control label{display:block;font-weight:800;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .control select, .control input[type=range]{width:100%;}
  .control select{
    font-family:inherit;font-weight:800;font-size:13px;color:var(--teal-dark);
    background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:10px;padding:8px 10px;
  }
  .range-val{font-weight:800;font-size:12.5px;color:var(--teal-dark);text-align:center;margin-top:4px;}

  /* ---------- drop zone ---------- */
  .drop-zone{
    border:2.5px dashed var(--teal-mid);border-radius:18px;padding:30px 16px;text-align:center;
    background:var(--teal-light);cursor:pointer;transition:border-color .15s, background .15s;
  }
  .drop-zone.drag{border-color:var(--teal);background:#DDF1EC;}
  .drop-zone .dz-icon{font-size:34px;margin-bottom:8px;}
  .drop-zone .dz-text{font-weight:800;font-size:14px;color:var(--teal-dark);}
  .drop-zone .dz-sub{font-weight:600;font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  #fileInput{display:none;}

  /* ---------- results ---------- */
  .results{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .result-item{
    display:flex;align-items:center;gap:12px;background:#F8FAFC;border:1.5px solid var(--line);
    border-radius:16px;padding:10px;
  }
  .result-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#eee;}
  .result-info{flex:1;min-width:0;}
  .result-name{font-weight:800;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .result-sizes{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:3px;}
  .result-sizes .before{text-decoration:line-through;color:#b9c2cc;}
  .result-sizes .after{color:var(--teal-dark);}
  .result-badge{
    background:var(--teal-light);color:var(--teal-dark);font-weight:900;font-size:11px;
    padding:3px 9px;border-radius:8px;margin-right:6px;
  }
  .result-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .dl-btn{
    background:linear-gradient(155deg,var(--gold),var(--gold-dark));border:none;border-radius:10px;
    padding:8px 14px;font-family:inherit;font-weight:800;font-size:12px;color:#5c4400;cursor:pointer;text-decoration:none;text-align:center;
  }
  .rm-btn{
    background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;
    font-family:inherit;font-weight:700;font-size:11.5px;color:var(--ink-soft);cursor:pointer;
  }
  .processing{font-size:11.5px;font-weight:700;color:var(--ink-soft);}

  .bulk-row{display:flex;gap:10px;margin-top:16px;}
  .bulk-btn{
    flex:1;font-family:inherit;font-weight:800;font-size:13.5px;border-radius:13px;padding:12px;cursor:pointer;border:none;
  }
  .bulk-btn.primary{background:var(--teal);color:#fff;}
  .bulk-btn.secondary{background:#fff;border:2px solid var(--line);color:var(--ink);}

  .empty-note{text-align:center;color:var(--ink-soft);font-weight:700;font-size:13px;padding:20px 10px;}

  @media (max-width:380px){
    .result-thumb{width:52px;height:52px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="topbar-inner">
      <a class="back-link" href="index.html">◀</a>
      <div class="topic-icon">🗜️</div>
      <div>
        <div class="topbar-title">أداة ضغط الصور</div>
        <div class="topbar-sub">قلّص حجم صور الصفحات قبل رفعها في إعدادات الدرس</div>
      </div>
    </div>
  </div>

  <div class="content-wrap">
    <div class="card">
      <div class="controls-row">
        <div class="control">
          <label>أقصى عرض للصورة</label>
          <select id="maxWidthSelect">
            <option value="700">٧٠٠ بكسل — أصغر حجم</option>
            <option value="900" selected>٩٠٠ بكسل — موصى به</option>
            <option value="1200">١٢٠٠ بكسل — جودة أعلى</option>
          </select>
        </div>
        <div class="control">
          <label>مستوى الجودة</label>
          <input type="range" id="qualityRange" min="40" max="90" value="72">
          <div class="range-val" id="qualityVal">٧٢٪</div>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="dz-icon">📷</div>
        <div class="dz-text">اضغط هنا لاختيار الصور، أو اسحبها وأفلتها</div>
        <div class="dz-sub">يدعم رفع أكثر من صورة دفعة واحدة</div>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>

      <div id="emptyNote" class="empty-note">لم تُضف أي صور بعد</div>
      <div class="results" id="results"></div>

      <div class="bulk-row" id="bulkRow" style="display:none;">
        <button class="bulk-btn primary" id="downloadAllBtn">تنزيل كل الصور المضغوطة</button>
        <button class="bulk-btn secondary" id="clearAllBtn">مسح الكل</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const results = document.getElementById('results');
  const emptyNote = document.getElementById('emptyNote');
  const bulkRow = document.getElementById('bulkRow');
  const maxWidthSelect = document.getElementById('maxWidthSelect');
  const qualityRange = document.getElementById('qualityRange');
  const qualityVal = document.getElementById('qualityVal');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');

  let items = []; // { id, name, originalSize, dataUrl, compressedSize }
  let seq = 0;

  qualityRange.addEventListener('input', ()=>{
    qualityVal.textContent = toArabicDigits(qualityRange.value) + '٪';
  });

  dropZone.addEventListener('click', ()=> fileInput.click());
  dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', (e)=>{
    e.preventDefault();
    dropZone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', ()=>{
    handleFiles(fileInput.files);
    fileInput.value = '';
  });

  function toArabicDigits(n){
    const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    return String(n).split('').map(ch => /\d/.test(ch) ? map[ch] : ch).join('');
  }

  function formatSize(bytes){
    if(bytes < 1024) return toArabicDigits(bytes) + ' بايت';
    const kb = bytes/1024;
    if(kb < 1024) return toArabicDigits(kb.toFixed(0)) + ' كيلوبايت';
    return toArabicDigits((kb/1024).toFixed(2)) + ' ميجابايت';
  }

  function handleFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    files.forEach(file => processFile(file));
  }

  function processFile(file){
    const id = 'img' + (++seq);
    const item = { id, name: file.name, originalSize: file.size, dataUrl: null, compressedSize: null };
    items.push(item);
    renderItem(item, true);
    updateBulkVisibility();

    const maxWidth = Number(maxWidthSelect.value);
    const quality = Number(qualityRange.value) / 100;

    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        item.dataUrl = dataUrl;
        item.compressedSize = Math.round((dataUrl.length - 'data:image/jpeg;base64,'.length) * 0.75);
        renderItem(item, false);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderItem(item, loading){
    let el = document.getElementById(item.id);
    if(!el){
      el = document.createElement('div');
      el.className = 'result-item';
      el.id = item.id;
      results.appendChild(el);
    }
    if(loading){
      el.innerHTML =
        '<img class="result-thumb" src="" style="visibility:hidden;">' +
        '<div class="result-info">' +
          '<div class="result-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="processing">جارٍ الضغط...</div>' +
        '</div>';
      return;
    }
    const reduction = item.originalSize > 0 ? Math.round((1 - item.compressedSize / item.originalSize) * 100) : 0;
    el.innerHTML =
      '<img class="result-thumb" src="' + item.dataUrl + '">' +
      '<div class="result-info">' +
        '<div class="result-name">' + escapeHtml(item.name) + '</div>' +
        '<div class="result-sizes"><span class="before">' + formatSize(item.originalSize) + '</span> ← <span class="after">' + formatSize(item.compressedSize) + '</span>' +
        (reduction > 0 ? '<span class="result-badge">تقليل ' + toArabicDigits(reduction) + '٪</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="result-actions">' +
        '<a class="dl-btn" download="' + suggestedName(item.name) + '" href="' + item.dataUrl + '">تنزيل</a>' +
        '<button class="rm-btn" data-id="' + item.id + '">حذف</button>' +
      '</div>';

    el.querySelector('.rm-btn').addEventListener('click', ()=>{
      items = items.filter(i => i.id !== item.id);
      el.remove();
      updateBulkVisibility();
    });
  }

  function suggestedName(originalName){
    const base = originalName.replace(/\.[^.]+$/, '');
    return (base || 'image') + '-compressed.jpg';
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function updateBulkVisibility(){
    const hasItems = items.length > 0;
    emptyNote.style.display = hasItems ? 'none' : 'block';
    bulkRow.style.display = hasItems ? 'flex' : 'none';
  }

  downloadAllBtn.addEventListener('click', ()=>{
    items.forEach((item, i)=>{
      if(!item.dataUrl) return;
      setTimeout(()=>{
        const a = document.createElement('a');
        a.href = item.dataUrl;
        a.download = suggestedName(item.name);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }, i * 250);
    });
  });

  clearAllBtn.addEventListener('click', ()=>{
    items = [];
    results.innerHTML = '';
    updateBulkVisibility();
  });

})();
</script>
</body>
</html>
